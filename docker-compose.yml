# Local development services. Start them with:  docker compose up -d
# Then run the app on your machine with:        npm run dev
services:
  postgres:
    # Postgres 16 with the pgvector extension (needed for the tutor's search in Phase 7)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coursebook
      POSTGRES_PASSWORD: coursebook
      POSTGRES_DB: coursebook
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursebook"]
      interval: 5s
      retries: 10

  redis:
    # Job queue (Phase 2+) and rate limiting
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mailpit:
    # Fake email inbox: open http://localhost:8025 to read verification / reset emails
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox

volumes:
  postgres-data:
  redis-data:
